<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c2185b">
<title>Writing · My Secret Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Caveat:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="diary">

<div class="scrim" data-drawer-close></div>

<div class="shell">

  <aside class="aside">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="2.5" width="18" height="19" rx="3" fill="var(--accent)"/>
        <rect x="3" y="2.5" width="4" height="19" rx="2" fill="var(--accent-hover)"/>
        <path d="M11 8.5h6M11 12h6M11 15.5h4" stroke="var(--on-accent)" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="brand__name">My Secret Diary</span>
    </div>

    <section class="block">
      <div class="stack">
        <a class="btn btn--quiet" href="home.html">← Back to my diary</a>
      </div>
    </section>

    <section class="block">
      <h2 class="block__title">Word meaning</h2>
      <label class="sr-only" for="lookInput">Look up a word</label>
      <input class="input" type="text" id="lookInput" placeholder="Type a word, press Enter">
      <p class="lookup" id="lookResult" style="margin-top:8px"></p>
    </section>

    <section class="block">
      <h2 class="block__title">Appearance</h2>
      <div class="seg" id="toneRow" role="group" aria-label="Light or dark">
        <button type="button" data-tone="light" aria-pressed="true">Light</button>
        <button type="button" data-tone="dark" aria-pressed="false">Dark</button>
      </div>
      <div class="swatches" id="swatches" role="group" aria-label="Accent colour" style="margin-top:12px"></div>
      <div class="slider-row">
        <label class="sr-only" for="hueSlider">Fine-tune the colour</label>
        <input type="range" id="hueSlider" min="0" max="360" step="1">
      </div>
      <span class="hint">Pick a shade, or drag for anything in between.</span>
    </section>
  </aside>

  <main class="main">
    <button class="btn btn--quiet btn--sm drawer-btn" data-drawer-open>☰ Menu</button>

    <div id="tip"></div>
    <div id="notice"></div>

    <div class="desk">
      <article class="sheet">

        <header class="sheet__top">
          <div class="sheet__id">
            <label class="sr-only" for="title">Give this page a name</label>
            <input class="sheet__title" type="text" id="title" maxlength="80" placeholder="Give this page a name">
            <p class="sheet__date" id="entryDate"></p>
          </div>

          <div class="acts">
            <button class="act" id="btnHistory" data-tip="See what I first typed" aria-label="See what I first typed">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10a9 9 0 1 1 2 6"/><path d="M3 5v5h5"/><path d="M12 8v4l3 2"/>
              </svg>
            </button>

            <button class="act" id="btnLock" data-tip="Lock this page" aria-label="Lock this page" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                <rect x="4.5" y="10.5" width="15" height="10" rx="2.3"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
              </svg>
            </button>

            <button class="act" id="btnDownload" data-tip="Save a copy to my device" aria-label="Save a copy to my device">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3v12"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 18.5h16"/>
              </svg>
            </button>

            <button class="act act--danger" id="btnDelete" data-tip="Delete this page" aria-label="Delete this page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 7h16"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/>
                <path d="M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12"/>
              </svg>
            </button>
          </div>
        </header>

        <div class="pair">
          <div class="pair__side">
            <label class="pair__label" for="fromLang">I am writing in</label>
            <select class="input" id="fromLang"></select>
          </div>
          <span class="pair__arrow" aria-hidden="true">→</span>
          <div class="pair__side">
            <label class="pair__label" for="intoLang">Turn it into</label>
            <select class="input" id="intoLang"></select>
          </div>
          <button class="pair__swap" id="swap" type="button" aria-label="Swap the two languages">⇄</button>
        </div>

        <div class="tools" role="toolbar" aria-label="Formatting">
          <label class="sr-only" for="faceSel">Handwriting style</label>
          <select class="tool-select" id="faceSel">
            <option value="serif">Book</option>
            <option value="sans">Plain</option>
            <option value="hand">Handwritten</option>
            <option value="mono">Typewriter</option>
          </select>

          <label class="sr-only" for="blockSel">Text size</label>
          <select class="tool-select" id="blockSel">
            <option value="p">Normal text</option>
            <option value="h2">Big heading</option>
            <option value="h3">Small heading</option>
            <option value="blockquote">Quote</option>
          </select>

          <span class="tool__sep" aria-hidden="true"></span>

          <button class="tool" data-cmd="bold" data-tip="Bold" aria-label="Bold" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 5h6.5a3.5 3.5 0 0 1 0 7H7z"/><path d="M7 12h7.5a3.5 3.5 0 0 1 0 7H7z"/>
            </svg>
          </button>

          <button class="tool" data-cmd="italic" aria-label="Italic" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <path d="M15 5h-5M14 19H9M14.5 5l-4 14"/>
            </svg>
          </button>

          <button class="tool" data-cmd="underline" aria-label="Underline" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <path d="M7 4v6a5 5 0 0 0 10 0V4"/><path d="M5 20h14"/>
            </svg>
          </button>

          <button class="tool" data-cmd="highlight" aria-label="Highlight" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 3.5 20.5 9.5 11 19H5v-6z"/><path d="M4 21.5h16"/>
            </svg>
          </button>

          <span class="tool__sep" aria-hidden="true"></span>

          <button class="tool" data-cmd="bullets" aria-label="Bulleted list" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor" stroke="none"/>
              <circle cx="4.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"/>
            </svg>
          </button>

          <button class="tool" data-cmd="numbers" aria-label="Numbered list" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 5.5 5 4.8V8"/><path d="M3.4 11.2h2.2L3.4 14.8h2.3"/><path d="M3.6 17h2v1.5h-1.6H5.6V20H3.5"/>
            </svg>
          </button>

          <button class="tool" data-cmd="table" aria-label="Insert a table">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9.5 9.5v10M15 9.5v10"/>
            </svg>
          </button>

          <button class="tool" data-cmd="line" aria-label="Insert a divider">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M4 12h16"/><path d="M7 7h10M7 17h10" opacity=".4"/>
            </svg>
          </button>

          <span class="tool__sep" aria-hidden="true"></span>

          <button class="tool" data-cmd="clear" aria-label="Remove formatting">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M8 6h11M12.5 6 9 18"/><path d="M4 4l16 16" opacity=".55"/>
            </svg>
          </button>
        </div>

        <div class="write" id="write" contenteditable="true" role="textbox"
             aria-multiline="true" aria-label="Your diary page" spellcheck="false"></div>

        <div class="strip" id="strip" aria-live="polite"></div>

        <footer class="sheet__foot">
          <span id="saveState">Saved</span>
          <span id="words">0 words</span>
          <span id="undoSlot"></span>
        </footer>
      </article>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
